spring.application.name=community-service

server.port=8081

spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# S3-B09: the schema belongs to Flyway (src/main/resources/db/migration); Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
# A database that already has tables but no flyway_schema_history (built earlier by ddl-auto=update) is marked as
# version 1 without running V1__baseline.sql, so existing data is kept. An empty database is created by V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.datasource.url=jdbc:mysql://localhost:3306/tounsiguide_community?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Location & Matching Service (8082): the Community Service only stores a locationId and checks it there.
tounsiguide.services.location-url=${LOCATION_SERVICE_URL:http://localhost:8082}

# Photos and videos of posts and comments (see docs/api/community-service-api.md, section Media).
# Storage: "local" = a folder of this server. Another provider (S3, MinIO, Cloudinary) = one new MediaStorage class.
tounsiguide.media.storage=local
tounsiguide.media.dir=${TOUNSIGUIDE_MEDIA_DIR:${user.home}/tounsiguide-media}
tounsiguide.media.max-image-bytes=10MB
tounsiguide.media.max-video-bytes=50MB
# Hourly removal of files uploaded more than 24 h ago and never attached.
tounsiguide.media.cleanup-cron=0 0 * * * *
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
# Read the rest of a too-big upload so the client receives the 413 answer instead of a reset connection.
server.tomcat.max-swallow-size=60MB

# Error bodies never show a stack trace, the exception or its message (devtools turns them on otherwise).
# Spring Boot 4 reads these under spring.web.error (server.error.* no longer applies).
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-message=never

# Shared secret between the Gateway and the services (header X-Internal-Token). Same value in all three; set INTERNAL_TOKEN in production.
tounsiguide.security.internal-token=${INTERNAL_TOKEN:dev-only-internal-token-change-me}
