spring.application.name=api-gateway
# Sprint plan: the Gateway is the only address the browser knows (8080).
server.port=8080

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Service addresses (override per environment, e.g. COMMUNITY_SERVICE_URL=http://community:8081)
tounsiguide.services.community-url=${COMMUNITY_SERVICE_URL:http://localhost:8081}
tounsiguide.services.location-url=${LOCATION_SERVICE_URL:http://localhost:8082}
tounsiguide.services.identity-url=${IDENTITY_SERVICE_URL:http://localhost:8083}

# --- community-service (8081): posts and comments ---
spring.cloud.gateway.server.webmvc.routes[0].id=community-posts
spring.cloud.gateway.server.webmvc.routes[0].uri=${tounsiguide.services.community-url}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/posts,/api/v1/posts/**

# --- location-service (8082): Location directory, place search, geocoding ---
spring.cloud.gateway.server.webmvc.routes[1].id=location-locations
spring.cloud.gateway.server.webmvc.routes[1].uri=${tounsiguide.services.location-url}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/locations,/api/v1/locations/**

# --- identity-service (8083): accounts, login, roles ---
spring.cloud.gateway.server.webmvc.routes[2].id=identity-auth
spring.cloud.gateway.server.webmvc.routes[2].uri=${tounsiguide.services.identity-url}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.server.webmvc.routes[3].id=identity-users
spring.cloud.gateway.server.webmvc.routes[3].uri=${tounsiguide.services.identity-url}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/users/**,/api/v1/admin/users,/api/v1/admin/users/**

# --- JWT validation (same secret and issuer as the identity-service) ---
# In production, set JWT_SECRET in the environment and never commit it.
tounsiguide.security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32chars-min}
tounsiguide.security.jwt.issuer=tounsiguide-identity
