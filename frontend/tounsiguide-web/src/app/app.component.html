<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" routerLink="/">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="var(--brand)"/><path d="M16 7c-4 0-7 3-7 7 0 5.5 7 11 7 11s7-5.5 7-11c0-4-3-7-7-7z" fill="#fff"/><circle cx="16" cy="14" r="2.8" fill="var(--brand)"/></svg>
      <span>Tounsi<b>Guide</b></span>
    </a>
    <nav aria-label="Navigation principale">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Fil général</a>
    </nav>
    <div class="session">
      @if (auth.user(); as u) {
        <span class="session-name" [title]="u.email">
          {{ u.displayName }}@if (auth.isAdmin()) { <span class="role-badge">Admin</span> }
        </span>
        <button type="button" class="btn btn-ghost btn-small" (click)="auth.logout()">Se déconnecter</button>
      } @else {
        <a class="btn btn-ghost btn-small" routerLink="/login">Se connecter</a>
        <a class="btn btn-primary btn-small" routerLink="/register">Créer un compte</a>
      }
    </div>
  </div>
</header>

<main class="container">
  <router-outlet />
</main>

<footer class="site-foot muted small">
  © TounsiGuide
</footer>
