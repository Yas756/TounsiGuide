spring.application.name=api-gateway
server.port=8085

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.cloud.gateway.server.webmvc.routes[0].id=community-posts
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/posts,/api/v1/posts/**

spring.cloud.gateway.server.webmvc.routes[1].id=community-locations
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/dummy-locations,/api/v1/dummy-locations/**

# --- identity-service (port 8083) ---
spring.cloud.gateway.server.webmvc.routes[2].id=identity-auth
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webmvc.routes[3].id=identity-users
spring.cloud.gateway.server.webmvc.routes[3].uri=http://localhost:8083
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/users/**,/admin/users/**

# --- JWT validation (same secret and issuer as the identity-service) ---
# In production, set JWT_SECRET in the environment and never commit it.
tounsiguide.security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32chars-min}
tounsiguide.security.jwt.issuer=tounsiguide-identity
