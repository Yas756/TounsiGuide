spring.application.name=business-service

# Sprint plan: Business Service listens on 8084 (reached only through the Gateway on 8080).
server.port=${SERVER_PORT:8084}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tounsiguide_business?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# S3-B09: the schema belongs to Flyway (src/main/resources/db/migration); Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
# A database that already has tables but no flyway_schema_history (built earlier by ddl-auto=update) is marked as
# version 1 without running V1__baseline.sql, so existing data is kept. An empty database is created by V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# --- Services read by this one (every call carries X-Internal-Token)
# Location Service: GET /api/v1/locations/{id}, GET /api/v1/locations?ids=, GET /api/v1/locations/{id}/posts
tounsiguide.location.url=${LOCATION_SERVICE_URL:http://localhost:8082}
# Community Service: GET /api/v1/posts/batch?ids= (published posts only)
tounsiguide.community.url=${COMMUNITY_SERVICE_URL:http://localhost:8081}
# Identity Service: POST /internal/users/{id}/roles/BUSINESS_REP when a request is approved
tounsiguide.identity.url=${IDENTITY_SERVICE_URL:http://localhost:8083}

# Error bodies never show a stack trace, the exception or its message (devtools turns them on otherwise).
# Spring Boot 4 reads these under spring.web.error (server.error.* no longer applies).
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-message=never

# Shared secret between the Gateway and the services (header X-Internal-Token). Same value everywhere; set INTERNAL_TOKEN in production.
tounsiguide.security.internal-token=${INTERNAL_TOKEN:dev-only-internal-token-change-me}
