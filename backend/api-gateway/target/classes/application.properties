spring.application.name=api-gateway
# Sprint plan: the Gateway is the only address the browser knows (8080).
server.port=8080

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Service addresses (override per environment, e.g. COMMUNITY_SERVICE_URL=http://community:8081)
tounsiguide.services.community-url=${COMMUNITY_SERVICE_URL:http://localhost:8081}
tounsiguide.services.location-url=${LOCATION_SERVICE_URL:http://localhost:8082}
tounsiguide.services.identity-url=${IDENTITY_SERVICE_URL:http://localhost:8083}
tounsiguide.services.business-url=${BUSINESS_SERVICE_URL:http://localhost:8084}

# Routes are tried in order, first match wins.
# /internal/** (service-to-service calls such as /internal/posts/{id}/changed) is deliberately NOT routed.

# --- location-service (8082): associations of a post. MUST stay before the community-posts route below,
# which would otherwise catch /api/v1/posts/{id}/associations (docs/api/association-api.md, section 7).
spring.cloud.gateway.server.webmvc.routes[0].id=location-post-associations
spring.cloud.gateway.server.webmvc.routes[0].uri=${tounsiguide.services.location-url}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/posts/*/associations,/api/v1/posts/*/associations/**

# --- community-service (8081): posts and comments ---
spring.cloud.gateway.server.webmvc.routes[1].id=community-posts
spring.cloud.gateway.server.webmvc.routes[1].uri=${tounsiguide.services.community-url}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/posts,/api/v1/posts/**

# --- location-service (8082): Location directory, place search, geocoding ---
spring.cloud.gateway.server.webmvc.routes[2].id=location-locations
spring.cloud.gateway.server.webmvc.routes[2].uri=${tounsiguide.services.location-url}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/locations,/api/v1/locations/**

# --- location-service (8082): associations (summary, review queue, confirm/reject/dispute/review) ---
spring.cloud.gateway.server.webmvc.routes[3].id=location-associations
spring.cloud.gateway.server.webmvc.routes[3].uri=${tounsiguide.services.location-url}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/associations,/api/v1/associations/**

# --- identity-service (8083): accounts, login, roles ---
spring.cloud.gateway.server.webmvc.routes[4].id=identity-auth
spring.cloud.gateway.server.webmvc.routes[4].uri=${tounsiguide.services.identity-url}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.server.webmvc.routes[5].id=identity-users
spring.cloud.gateway.server.webmvc.routes[5].uri=${tounsiguide.services.identity-url}
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/v1/users/**,/api/v1/admin/users,/api/v1/admin/users/**

# --- community-service (8081): photos and videos (upload, metadata, file with Range support) ---
spring.cloud.gateway.server.webmvc.routes[6].id=community-media
spring.cloud.gateway.server.webmvc.routes[6].uri=${tounsiguide.services.community-url}
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/v1/media,/api/v1/media/**

# --- business-service (8084, Sprint 3): business pages, page requests, walls ---
# Reading pages and walls is public like posts (GET); requests, decisions, edits and hiding need a token.
spring.cloud.gateway.server.webmvc.routes[7].id=business-pages
spring.cloud.gateway.server.webmvc.routes[7].uri=${tounsiguide.services.business-url}
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/api/v1/business-pages,/api/v1/business-pages/**

# --- community-service (8081, Sprint 3): reports and moderation (members report, administrators decide) ---
spring.cloud.gateway.server.webmvc.routes[8].id=community-reports
spring.cloud.gateway.server.webmvc.routes[8].uri=${tounsiguide.services.community-url}
spring.cloud.gateway.server.webmvc.routes[8].predicates[0]=Path=/api/v1/reports,/api/v1/reports/**

# --- community-service (8081, Sprint 3): topic modules (propose, approve, browse) ---
spring.cloud.gateway.server.webmvc.routes[9].id=community-modules
spring.cloud.gateway.server.webmvc.routes[9].uri=${tounsiguide.services.community-url}
spring.cloud.gateway.server.webmvc.routes[9].predicates[0]=Path=/api/v1/modules,/api/v1/modules/**

# Uploads (photo 10 MB, video 50 MB) are streamed to the community-service as they are: the Gateway must not parse
# multipart bodies itself (its default limit is 1 MB and the parsed body would no longer be forwarded).
spring.servlet.multipart.enabled=false
# Read the rest of a too-big upload so the browser receives the 413 answer instead of a reset connection.
server.tomcat.max-swallow-size=60MB

# --- JWT validation (same secret and issuer as the identity-service) ---
# In production, set JWT_SECRET in the environment and never commit it.
tounsiguide.security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32chars-min}
tounsiguide.security.jwt.issuer=tounsiguide-identity

# Error bodies never show a stack trace, the exception or its message (devtools turns them on otherwise).
# Spring Boot 4 reads these under spring.web.error (server.error.* no longer applies).
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-message=never

# Shared secret between the Gateway and the services (header X-Internal-Token). Same value in all three; set INTERNAL_TOKEN in production.
tounsiguide.security.internal-token=${INTERNAL_TOKEN:dev-only-internal-token-change-me}

# Origins allowed by CORS (comma separated patterns, S2-B10). Add the deployed Angular origin here or in CORS_ALLOWED_ORIGINS.
tounsiguide.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
