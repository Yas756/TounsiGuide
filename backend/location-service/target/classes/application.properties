spring.application.name=location-service

# Sprint plan: Location & Matching Service listens on 8082 (reached only through the Gateway on 8080).
server.port=${SERVER_PORT:8082}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tounsiguide_location?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# --- Matching: "rule-based" works with no AI (Sprint 2, acceptance criterion A7).
# A future AI module registers another MatchingProvider and is selected here.
tounsiguide.matching.provider=rule-based

# --- Geocoding (search on the map, reverse geocoding of a click).
# "photon" = OpenStreetMap data through Photon (komoot), free, no key. "none" turns external search off.
tounsiguide.geocoding.provider=${GEOCODING_PROVIDER:photon}
tounsiguide.geocoding.photon.url=${PHOTON_URL:https://photon.komoot.io}
# Results are limited to Tunisia: minLon,minLat,maxLon,maxLat
tounsiguide.geocoding.photon.bbox=7.5,30.2,11.6,37.6
tounsiguide.geocoding.language=fr
tounsiguide.geocoding.timeout=4s
tounsiguide.geocoding.cache-ttl=10m
tounsiguide.geocoding.user-agent=TounsiGuide/0.2 (student integration project)
