spring.application.name=location-service

# Sprint plan: Location & Matching Service listens on 8082 (reached only through the Gateway on 8080).
server.port=${SERVER_PORT:8082}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tounsiguide_location?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# S3-B09: the schema belongs to Flyway (src/main/resources/db/migration); Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
# A database that already has tables but no flyway_schema_history (built earlier by ddl-auto=update) is marked as
# version 1 without running V1__baseline.sql, so existing data is kept. An empty database is created by V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# --- Matching: "rule-based" works with no AI (Sprint 2, acceptance criterion A7).
# A future AI module registers another MatchingProvider and is selected here.
tounsiguide.matching.provider=rule-based

# --- Associations post <-> Location (docs/api/association-api.md)
# Community Service, read only: GET /api/v1/posts/{id} and /api/v1/posts/{id}/comments
tounsiguide.community.url=${COMMUNITY_SERVICE_URL:http://localhost:8081}
# Which AssociationAnalyzer answers first; the fallback answers when it fails, times out or is turned off (A7).
tounsiguide.analysis.provider=rule-based
tounsiguide.analysis.timeout=20s
tounsiguide.analysis.fallback=rule-based
# A CONFIRMED association whose score falls below this becomes DISPUTED.
tounsiguide.association.dispute-threshold=75
# Prior P of the score formula for every origin except AUTHOR.
tounsiguide.association.prior-weight=2
# Evidence weights (section 3). Changing them only affects evidence created afterwards.
tounsiguide.association.weights.AUTHOR_TAG=10
tounsiguide.association.weights.AUTHOR_CONFIRMED=10
tounsiguide.association.weights.PAGE_MENTION=6
tounsiguide.association.weights.MEMBER_SUGGESTION=3
tounsiguide.association.weights.TEXT_MENTION=2
tounsiguide.association.weights.COMPETING_CLAIM=2
tounsiguide.association.weights.MEMBER_DISPUTE=3
tounsiguide.association.weights.BUSINESS_DISPUTE=10
# Turn existing Post.locationId values into AUTHOR associations at startup (idempotent).
tounsiguide.association.migrate-on-startup=true

# --- Geocoding (search on the map, reverse geocoding of a click).
# "photon" = OpenStreetMap data through Photon (komoot), free, no key. "none" turns external search off.
tounsiguide.geocoding.provider=${GEOCODING_PROVIDER:photon}
tounsiguide.geocoding.photon.url=${PHOTON_URL:https://photon.komoot.io}
# Results are limited to Tunisia: minLon,minLat,maxLon,maxLat
tounsiguide.geocoding.photon.bbox=7.5,30.2,11.6,37.6
tounsiguide.geocoding.language=fr
tounsiguide.geocoding.timeout=4s
tounsiguide.geocoding.cache-ttl=10m
tounsiguide.geocoding.user-agent=TounsiGuide/0.2 (student integration project)

# Error bodies never show a stack trace, the exception or its message (devtools turns them on otherwise).
# Spring Boot 4 reads these under spring.web.error (server.error.* no longer applies).
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-message=never

# Shared secret between the Gateway and the services (header X-Internal-Token). Same value in all three; set INTERNAL_TOKEN in production.
tounsiguide.security.internal-token=${INTERNAL_TOKEN:dev-only-internal-token-change-me}
